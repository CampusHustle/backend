name: CampusHustle Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Lint, Test & Server Health Check
  # =========================================================================
  ci:
    name: CI Checks (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: mongodb://127.0.0.1:27017/campus_hustle_test
      JWT_SECRET: ci_test_jwt_secret_key_for_testing_only
      JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_for_testing_only
      EMAIL_VERIFICATION_SECRET: ci_test_email_verification_secret_key
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_VERIFICATION_EXPIRES_IN: 24h
      CLIENT_URL: http://localhost:5173
      CLOUDINARY_CLOUD_NAME: test_cloud
      CLOUDINARY_API_KEY: '123456789'
      CLOUDINARY_API_SECRET: test_secret_key

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter / Syntax Checks
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Verify Server Startup & Health Check Endpoint
        run: |
          node index.js &
          SERVER_PID=$!
          
          # Poll health endpoint up to 10 attempts
          for i in {1..10}; do
            if curl -s http://127.0.0.1:5000/api/health | grep '"status":"ok"'; then
              echo "Server is healthy!"
              kill $SERVER_PID
              exit 0
            fi
            echo "Waiting for server to be ready (attempt $i/10)..."
            sleep 1
          done
          
          echo "Health check timed out."
          kill $SERVER_PID || true
          exit 1

  # =========================================================================
  # 2. Continuous Deployment (CD): Production Deployment (Render)
  # =========================================================================
  cd:
    name: CD Deployment (Production)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Production Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment to Render..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$DEPLOY_HOOK_URL")
            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
            
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "Deployment triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "Deployment trigger failed with status $HTTP_STATUS: $HTTP_BODY"
              exit 1
            fi
          else
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository secrets. Skipping remote webhook trigger."
          fi
